<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Results | QuizMaster Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "surface-dim": "#0b1326", "tertiary": "#4edea3",
          "surface-variant": "#2d3449", "on-surface-variant": "#cbc3d7",
          "outline": "#958ea0", "primary": "#d0bcff", "on-background": "#dae2fd",
          "primary-container": "#a078ff", "error-container": "#93000a",
          "inverse-primary": "#6d3bd7", "secondary-container": "#6f00be",
          "outline-variant": "#494454", "surface-container": "#171f33",
          "surface-container-highest": "#2d3449", "surface-container-high": "#222a3d",
          "tertiary-container": "#00a572", "on-primary": "#3c0091",
          "surface": "#0b1326", "error": "#ffb4ab", "background": "#0b1326",
          "secondary": "#ddb7ff", "surface-container-low": "#131b2e",
          "on-surface": "#dae2fd",
        },
        "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        "spacing": { "md": "24px", "gutter": "24px", "xs": "4px", "container-max": "1200px", "lg": "48px", "base": "8px", "sm": "12px", "xl": "80px" },
        "fontFamily": { "label-sm": ["Inter"], "label-md": ["Inter"], "headline-md": ["Inter"], "body-lg": ["Inter"], "display-xl": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"] },
        "fontSize": {
          "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
          "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
          "display-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
          "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
        }
      },
    },
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .glass-card { backdrop-filter: blur(12px); background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; }
  .score-gradient { background: linear-gradient(135deg, #8B5CF6 0%, #A855F7 100%); }
  #score-arc { transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">

<header class="bg-surface border-b border-outline-variant shadow-sm sticky top-0 z-50">
  <nav class="flex justify-between items-center w-full px-md md:px-lg max-w-container-max mx-auto h-16">
    <a href="dashboard.html" class="text-headline-md font-headline-md font-extrabold text-primary">QuizMaster Pro</a>
    <div class="hidden md:flex items-center gap-lg">
      <a class="text-on-surface-variant font-label-md hover:text-primary transition-colors" href="dashboard.html">Dashboard</a>
      <a class="text-on-surface-variant font-label-md hover:text-primary transition-colors" href="leaderboard.html">Leaderboard</a>
    </div>
  </nav>
</header>

<main class="flex-grow flex items-center justify-center py-xl px-md relative">
  <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary/10 blur-[100px] rounded-full pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary/10 blur-[120px] rounded-full pointer-events-none"></div>

  <div class="max-w-container-max w-full flex flex-col lg:flex-row gap-gutter items-center">
    <!-- Left: Performance stats -->
    <div class="w-full lg:flex-1 space-y-lg text-center lg:text-left">
      <div class="space-y-sm">
        <span class="inline-block px-md py-xs bg-tertiary/10 text-tertiary border border-tertiary/20 rounded-full font-label-md text-label-md uppercase tracking-widest">
          Quiz Completed
        </span>
        <h1 id="result-heading" class="text-display-xl font-display-xl text-on-surface">Well Done!</h1>
        <p class="text-body-lg font-body-lg text-on-surface-variant">
          <span id="result-user">Player</span> — <span id="result-category">General</span> · <span id="result-difficulty">Easy</span>
        </p>
      </div>

      <div class="grid grid-cols-2 gap-md">
        <div class="glass-card p-md rounded-xl text-center">
          <span class="material-symbols-outlined text-tertiary mb-xs" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          <div id="result-correct" class="text-headline-md font-headline-md text-tertiary">0</div>
          <div class="text-label-sm font-label-sm text-on-surface-variant uppercase">Correct</div>
        </div>
        <div class="glass-card p-md rounded-xl text-center">
          <span class="material-symbols-outlined text-error mb-xs" style="font-variation-settings: 'FILL' 1;">cancel</span>
          <div id="result-incorrect" class="text-headline-md font-headline-md text-error">0</div>
          <div class="text-label-sm font-label-sm text-on-surface-variant uppercase">Incorrect</div>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-md justify-center lg:justify-start">
        <button id="btn-leaderboard" class="px-xl py-md bg-gradient-to-r from-[#8B5CF6] to-[#A855F7] text-white font-label-md rounded-xl shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-sm">
          View Leaderboard
          <span class="material-symbols-outlined">trending_up</span>
        </button>
        <button id="btn-retry" class="px-xl py-md bg-surface-container-highest border border-outline-variant text-on-surface font-label-md rounded-xl hover:bg-surface-variant active:scale-95 transition-all">
          Try Again
        </button>
        <button id="btn-dashboard" class="px-xl py-md bg-surface-container border border-outline-variant text-on-surface-variant font-label-md rounded-xl hover:bg-surface-container-high active:scale-95 transition-all">
          Dashboard
        </button>
      </div>
    </div>

    <!-- Right: Score ring card -->
    <div class="w-full lg:flex-1 flex justify-center lg:justify-end">
      <div class="relative w-full max-w-[440px]">
        <div class="glass-card p-xl rounded-[2rem] shadow-2xl relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent pointer-events-none"></div>
          <div class="flex flex-col items-center gap-lg">
            <!-- Score ring -->
            <div class="relative w-64 h-64 flex items-center justify-center">
              <svg class="w-full h-full -rotate-90" viewBox="0 0 256 256">
                <circle class="text-surface-container-highest" cx="128" cy="128" fill="transparent" r="110" stroke="currentColor" stroke-width="12"></circle>
                <circle id="score-arc" cx="128" cy="128" fill="transparent" r="110"
                  stroke="url(#scoreGradient)" stroke-dasharray="691" stroke-dashoffset="691"
                  stroke-linecap="round" stroke-width="12"></circle>
                <defs>
                  <linearGradient id="scoreGradient" x1="0%" x2="100%" y1="0%" y2="0%">
                    <stop offset="0%" stop-color="#8B5CF6"></stop>
                    <stop offset="100%" stop-color="#4edea3"></stop>
                  </linearGradient>
                </defs>
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span id="result-score" class="text-[56px] font-extrabold leading-none text-on-surface">0</span>
                <span id="result-total" class="text-label-md font-label-md text-on-surface-variant uppercase tracking-widest">/ 0</span>
              </div>
            </div>

            <!-- Stats breakdown -->
            <div class="w-full space-y-md">
              <div class="flex justify-between items-center px-md">
                <div class="flex items-center gap-sm">
                  <div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(208,188,255,0.8)]"></div>
                  <span class="text-body-md font-body-md text-on-surface-variant">Accuracy</span>
                </div>
                <span id="result-accuracy" class="text-body-md font-body-md font-bold text-on-surface">0%</span>
              </div>
              <div class="flex justify-between items-center px-md">
                <div class="flex items-center gap-sm">
                  <div class="w-2 h-2 rounded-full bg-tertiary shadow-[0_0_8px_rgba(78,222,163,0.8)]"></div>
                  <span class="text-body-md font-body-md text-on-surface-variant">Time Bonus</span>
                </div>
                <span id="result-time-bonus" class="text-body-md font-body-md font-bold text-on-surface">+0 pts</span>
              </div>
              <div class="h-px bg-outline-variant/30 w-full"></div>
              <div class="flex justify-between items-center px-md">
                <span class="text-label-md font-label-md text-on-surface font-bold uppercase tracking-widest">Global Rank</span>
                <span id="result-rank" class="text-headline-md font-headline-md text-primary">-</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="bg-surface-dim border-t border-outline-variant">
  <div class="w-full py-lg px-md flex flex-col md:flex-row justify-between items-center max-w-container-max mx-auto gap-md">
    <div class="flex flex-col items-center md:items-start gap-xs">
      <span class="text-label-md font-label-md font-bold text-on-surface">QuizMaster Pro</span>
      <p class="text-label-sm font-label-sm text-on-surface-variant">© 2024 QuizMaster Pro. Elevate your knowledge.</p>
    </div>
    <div class="flex gap-md">
      <a class="text-on-surface-variant text-label-sm font-label-sm hover:text-primary transition-colors" href="#">Privacy Policy</a>
      <a class="text-on-surface-variant text-label-sm font-label-sm hover:text-primary transition-colors" href="#">Terms of Service</a>
    </div>
  </div>
</footer>

<script type="module" src="./js/results.js"></script>
</body>
</html>
