<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quiz | QuizMaster Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "surface-dim": "#0b1326", "tertiary": "#4edea3",
          "surface-variant": "#2d3449", "on-surface-variant": "#cbc3d7",
          "outline": "#958ea0", "on-secondary": "#490080",
          "primary": "#d0bcff", "on-background": "#dae2fd", "primary-container": "#a078ff",
          "error-container": "#93000a", "inverse-primary": "#6d3bd7",
          "on-primary-container": "#340080", "secondary-container": "#6f00be",
          "outline-variant": "#494454", "surface-container": "#171f33",
          "surface-container-highest": "#2d3449", "surface-container-high": "#222a3d",
          "tertiary-container": "#00a572", "on-primary": "#3c0091",
          "surface": "#0b1326", "on-tertiary": "#003824",
          "error": "#ffb4ab", "background": "#0b1326", "secondary": "#ddb7ff",
          "surface-container-low": "#131b2e", "on-surface": "#dae2fd",
          "on-tertiary": "#003824",
        },
        "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        "spacing": { "md": "24px", "gutter": "24px", "xs": "4px", "container-max": "1200px", "lg": "48px", "base": "8px", "sm": "12px", "xl": "80px" },
        "fontFamily": { "label-sm": ["Inter"], "label-md": ["Inter"], "headline-md": ["Inter"], "body-lg": ["Inter"], "display-xl": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"] },
        "fontSize": {
          "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
          "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
          "display-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
          "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
        }
      },
    },
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .glass-panel { backdrop-filter: blur(12px); background: rgba(30, 41, 59, 0.7); }
  .progress-glow { box-shadow: 0 0 15px rgba(139, 92, 246, 0.6); }
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">

<header class="w-full fixed top-0 z-50 bg-surface-dim/80 backdrop-blur-md">
  <div class="max-w-container-max mx-auto h-16 px-md flex justify-between items-center">
    <a href="dashboard.html" class="text-primary font-headline-md font-extrabold tracking-tighter">QuizMaster Pro</a>
    <div class="flex items-center gap-md">
      <div class="flex items-center gap-xs bg-surface-container-high px-sm py-xs rounded-lg border border-outline-variant">
        <span class="material-symbols-outlined text-primary text-body-md">stars</span>
        <span id="score-display" class="font-label-md text-primary">Score: 0</span>
      </div>
      <div id="timer-wrapper" class="flex items-center gap-xs bg-surface-container-high px-sm py-xs rounded-lg border border-outline-variant transition-colors">
        <span class="material-symbols-outlined text-on-surface-variant text-body-md">timer</span>
        <span id="timer-display" class="font-label-md text-on-surface-variant">00:30</span>
      </div>
    </div>
  </div>
  <div class="w-full h-1.5 bg-surface-variant relative overflow-hidden">
    <div id="progress-bar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-primary-container to-secondary-container progress-glow rounded-r-full transition-all duration-500" style="width: 0%"></div>
  </div>
</header>

<div id="loading-overlay" class="fixed inset-0 z-50 bg-background/80 flex items-center justify-center" style="display:none!important">
  <div class="flex flex-col items-center gap-md">
    <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
    <p class="text-label-md text-on-surface-variant">Loading questions...</p>
  </div>
</div>

<main class="flex-grow flex flex-col items-center justify-center pt-xl pb-lg px-md relative overflow-hidden">
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>

  <p id="error-msg" class="hidden text-error text-center text-body-md max-w-md mb-md p-md bg-error-container/20 rounded-lg border border-error/20"></p>

  <div class="mb-md">
    <span id="question-counter" class="bg-surface-container-highest px-md py-xs rounded-full border border-outline-variant font-label-md text-on-surface-variant">
      Question 1 of 10
    </span>
  </div>

  <div class="w-full max-w-[800px] glass-panel border border-outline-variant/30 rounded-xl p-lg shadow-2xl relative">
    <div class="absolute -top-px left-md right-md h-px bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>
    <div class="space-y-lg text-center">
      <h1 id="question-text" class="font-headline-lg text-headline-lg text-on-surface leading-tight tracking-tight">
        Loading question...
      </h1>
      <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-md pt-md">
        <!-- Options rendered by quiz.js -->
      </div>
    </div>
  </div>

  <div class="mt-lg flex items-center gap-md">
    <button id="btn-skip" class="flex items-center gap-xs text-on-surface-variant hover:text-on-surface transition-colors px-md py-sm">
      <span class="material-symbols-outlined">skip_next</span>
      <span class="font-label-md">Skip</span>
    </button>
    <button id="btn-submit" class="px-xl py-sm bg-gradient-to-r from-primary-container to-secondary-container text-on-primary-container font-label-md rounded-lg shadow-lg hover:shadow-primary/20 transition-all active:scale-95">
      Submit Answer
    </button>
    <a href="dashboard.html" class="flex items-center gap-xs text-on-surface-variant hover:text-on-surface transition-colors px-md py-sm">
      <span class="material-symbols-outlined">home</span>
      <span class="font-label-md">Exit</span>
    </a>
  </div>
</main>

<aside class="hidden xl:flex fixed right-md top-1/2 -translate-y-1/2 flex-col gap-md">
  <div class="glass-panel border border-outline-variant p-md rounded-xl flex flex-col items-center gap-xs">
    <span class="text-on-surface-variant font-label-sm">STREAK</span>
    <span class="material-symbols-outlined text-secondary text-headline-md" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
    <span class="font-headline-md font-extrabold text-secondary">0</span>
  </div>
</aside>

<footer class="w-full border-t border-outline-variant/30 py-md px-md bg-surface-dim">
  <div class="max-w-container-max mx-auto flex justify-between items-center">
    <span class="font-label-sm text-on-surface-variant">© 2024 QuizMaster Pro.</span>
  </div>
</footer>

<script type="module" src="./js/quiz.js"></script>
</body>
</html>
